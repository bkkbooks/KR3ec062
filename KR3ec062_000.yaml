body:
  text: 一補劑溫中人參大補氣虛兼扶血弱鎮靈臺以保驚癇通經脈而托痘疹回生於脫血昏眩奪命於亡陽厥逆療胎前百怯而橫生逆産尤良培産後諸虛而食滯瘀凝未可內傷勞熱可救心腹虛痛莫缺同白朮則補中共黃耆則補表元氣下陷須佐升柴淋癃虛祕賴和苓膝脾虛腫脹靈劑肺熱喘嗽毒鴆黃耆入肺充血分以托陷伏之陰疽而既潰者尤驗實腠理以固表疏之虛汗而邪盛者非宜護陽虛外寒退陰虛內熱脾虧兼術血弱兼歸赤子慢驚與痘漿之清薄俱宜女人胎痢及崩帶之淋漓皆善實痰實嗽不相當虛脹虛膨深得益白朮入脾肺經強胃加餐固脾除濕虛膨虛脹助以參耆虛暈虛眩濟以麻半久痢固可以投久瘧非斯莫截君枳實有消痞之功佐條芩為安胎之劑斂虛汗擬似耆能補中氣幾如參力喘哮難施血虛毋忌大棗入脾養脾胃益氣調中潤心肺生津止嗽療老人血涸而便難治女人臟躁而如祟奔豚用之補脾以平腎也停飲用之培土以勝水也蟲子疳兒莫食牙病腹滿毋嘗平補阿膠入肺肝腎安血虛胎動止血熱吐衄定痿弱之喘止休息之痢崩帶宜投痔漏可入山藥入脾補脾胃而益中氣之虛培腰腎以固元精之泄癇症堪親癆家深切津枯腸滑共云神血崩帶下交稱捷此氣平味淡補脾補腎之功居多何首烏入肝腎性溫能壯陽道味澀能固元精頸項瘰癧與皮膚燥癢皆宜腰膝痿軟與筋骨痠痛咸善瘡疽與腸中堅結生用何妨痎瘧與胃裡痰凝炒則為良助痘漿白滿醫所不知治蠱毒入腹書多不載鬚髮斑白恣服重黑顏色枯稿以餌還榮百合入肺肝療腹脹心疼利大小便難而立效能補中益氣除浮腫痞滿而功高寒熱周身疼痛百邪鬼魅能消遠驚悸殺蟲毒傷寒壞後堪醫治乳瘡療喉痹發背癰疽並治芡實入脾腎益氣強志而澀精補中健脾而耐老療腰膝無溫痹之疼痛驅暴病致耳目之聰明補心腎之功固多實脾胃之氣最捷薏苡仁入脾胃清熱保肺咳膿咯血交宜而調癆深當滲濕扶脾腸滑肌浮並可而侑食偏優腳膝攣痹須分寒熱膀胱淋澀勿藉君臣根搗汁以和醪黃疸有驗葉煮湯而作澡赤子無疴蓮入肝藕可清心涼血不惟消煩渴而吐衄者尤能去舊以生新實入腎心可養心補脾不獨固遺滑而瀉利者更善升清以降濁葉有鼓胃之功節入心脾有止血之益女人御帶則房靈男子塞精則須入心腎利甘草入脾胃生入心則瀉火炙則溫中能解百毒調攝諸藥出聲音而咽疼並濟消煩渴而咳嗽咸寧混參耆作氣虛之助和歸芍作血少之需梢能抑相火而除莖痛節可消膿腫以療瘡疽嘔逆脹滿莫輕投下部藥中宜少用柏子仁入心脾辛能潤肺甘可生心助聰明輕身榮色守魂魄鎮悸驅驚護夜啼之赤子濡腸閉於老人滋陰熟地黃入足太陰經封填精髓專充腎臟之虧滋培血海善濟肝家之竭功全産後諸虛效總胎前百怯得車前以導水仲景之深思得縮砂以固脾東垣之祕計天冬入肺腎上潤肺金清熱痰而止嗽下滋腎水養枯液以培陰肺腎火燥而吐衄神樓散矣脾胃濕寒而泄痢桃生術焉麥冬入肺心清心火以解煩渴滋肺金以寧咳嗽血湧須遵氣短堪用同五味人參防暑邪之侵擾共玄參知母降虛熱之妄行龜板入腎心上補心血有虧因而降火下補腎元不足所以滋陰攻痔漏膿乾肉長治腸風痛止血消令健忘之多記使不睡者安眠鹿茸入腎生精血四肢腰膝痠疼之並補興陽道泄精溺血勞瘧之盡攻益氣強志暖髓悅容女人崩下男子尿血冬至陽生麋角解夏至陰生鹿角蛻則知麋可以補陽鹿可以補陰矣鹿角入腎強筋骨補絶傷腰脊腳膝而能療治疽瘡逐邪氣陰中留血而盡攻療折傷惡血與尿血祛婦人鬼交與鬼迷鹿髓味甘氣溫補陰強陽治丈夫女人之絶傷療咳逆腰膝之攣急地黃汁煮膏可填精而補髓蜂蜜煎服能強陽而生男鹿腎能補腎陰亦興陽道鹿肉甘溫能潤肌膚益氣力而通脈強五臟而補中鹿角膠止崩中與吐血除腹痛而安胎鎖陽入腎補陰氣益精髓酥炙能滑大腸興陽道補虛勞性與蓯蓉相似肉蓯蓉入腎養五臟強陰益精除寒熱勞傷並補男子陽絶不興兼治泄精尿血遺瀝婦人陰絶不産並療陰寒血崩帶下暖腰膝強精髓補相火於命門壯陰陽令多子治癥瘕於陰疝老人燥結便閉而腎火虛者宜之少年陽強易興而精不固者須忌菟絲子入肝脾腎添精補髓強陰道而堅筋骨腰疼膝冷益氣力而續絶傷腎宮寒而精自出得此無虞尿餘瀝而夢鬼交用之不犯除口苦燥渴去寒血為殃子宮冷而小腹常痛崩漏下而淋瀝無常肝腎不足去風明日此藥補而不峻溫而不燥故虛可補實可瀉寒可溫熱可涼溫可燥燥可潤非若黃柏知母之性苦寒不溫而瀉腎經之氣非若肉桂益智之性辛溫不涼而動腎經之燥非若蓯蓉鎖陽之性甘鹹滯氣而生腎經之濕惟陽強不痿大便燥結小水赤色者勿用以其性偏助陽也枸杞子入肝腎補髓填精而陽道之痿可興榮筋壯骨而腰膝之疲可扶羸瘦勞神真妙血虛目暗多奇牛膝入肝腎營筋骨而痿痹之患可蘇強腰膝而精髓之枯堪益胞衣不下勿失冬葵血閉不行寧忘乾漆氣化遲難協人參而陡利前陰澀痛卻甘尾而難通腎弱固稱引經脾虛卻為禁劑杜仲入肝腎筋骨離而復合精髓極而更生胎前固宜産後亦效腳膝痠痛難踐得飛步之功腰腎虛弱難眠得轉展之妙續斷入肝腎治勞倦所傷於腰膝之痿扶胎育所損於血海之虛固堪去舊又克生新五加皮入肝腎補中益精堅筋壯氣陰萎囊濕堪利淋瀝風痹心腹疝氣能除女子陰癢治遠年肌膚之瘀血利近日五緩之四肢疽瘡陰蝕而無危腰脊腳膝而並起如背拘急加蒼朮白芷胸脅疼痛加枳殼青皮頭痛必佐以川芎手痹不無乎肉桂腰痛而杜仲可加腳重而牛膝莫舍釀酒飲不惟療風治痹而諸病自有神也葫蘆巴入肝腎補無臟虛冷之疝氣療陰寒腹脅之脹滿面色青黑非此不可聰耳明目舍是何堪得附子雄黃而治腎虛佐茴香桃仁而利膀胱此太陽少陰藥也巴戟天入腎治大風邪氣療陰痿不足強筋骨安五臟補中增志而益氣祛陰疝消白濁夢遺精滑均堪痊陰中引痛風癩五勞腎宮虛損聽戶鳴聲破故紙入腎起陽衰燥陰濕補腎虛腰痛止腎敗精流足痿與牛膝合用子泄偕五味同投蠶蛾強陰道而交接不泄益精氣而駐顏不老主心腹邪氣能強志生子安神茯苓入脾胃和中用白導水用赤夾半夏以清痰和澤瀉以行濕地黃得之而補腎白朮同之而補脾去小腸之濕熱而淋閉通清水府之郁濕而白淫御茯神入心啓善忘開心志安魂魄養心神治風痃虛勞止口乾驚悸因其善養心血用以遠志為佐遠志入肺腎補腎以興陽道之痿安心以保神氣之疲耳鳴夢遺莫徘徊驚悸多忘應洽浹硃砂安神定魄降心火以養精神祛疫消毒通血脈而悅顏色驚風邪魅能除顛狂目痛堪醫丹砂除煩止渴益氣安神助犀連抑心火之亢同參苓補心氣之虛能收魂魄又堪明目琥珀入心肺肝決水泉淋癃咸提肅神府驚惕交安産後頭昏賴為行血癥瘕腹痛仗以磨堅血燥且停懷胎勿妄二散劑散寒麻黃入肺治傷寒頭疼療中風溫瘧赤黑斑毒能解外邪厥逆如神肺臟火邪內郁以致喘促痰升不得眠助以石膏蘇子膀胱寒毒外拘以致戰栗頭疼不得汗佐以甘草黃芩配花粉治乳癰下乳汁血脈全通同半夏定喘哮止咳嗽氣閉堪散秋冬表熱為良營衛虛弱莫投細辛入腎三陽數變之風邪可投少陰合病之頭痛必用聲音之啞效在包寒睛翳之蒙功惟寒鬱佐升麻而齒痛捐共辛夷而鼻淵住紫蘇入肺葉可疏風發汗四時感冒而咳嗽交平梗能順氣行痰五內虛膨而妊娠咸益蘇子入肺治痰凝胸膈而咳嗽靡寧理氣滯喉嚨而喘哮不絶實人無汗為優虛人有汗為劣桔梗入肺載諸藥上浮幾同舟楫引諸藥入肺擬比先鋒咳嗽咽疼協甘草而兼施喘哮膈脹求枳殼而相將鼻塞可通音啞可亮生薑開胃豁痰嘔吐無分寒熱溫經發表哮喘獨利寒痰霧毒與風邪而壯熱憎寒者均賴傷寒與溫瘧而頭疼鼻塞者全憑中寒水瀉功猶反掌舌強口噤效擬通神同半夏而咽喉無麻戟之虞制地黃而胸膈無膩滯之慮脈益奇疴夏子益之神也産科內線魏夫子之祕乎散風桂枝入肺膀胱去風邪以實衛多汗者須此藩籬祛寒氣以調榮畏冷者藉斯屏障和羌半而肩背之痠痛遂瘳助靈仙而手足之麻痹能濟解肌發汗當合麻杏溫經通脈須配歸艽羌活入足太陽足少陰厥陰排巨陽之寒邪散周身之風氣惡寒發熱與筋骨痠疼須此頭痛脊強及手足攣急當求瘡疽盡掃斑疹齊稀佐辛夷而鼻淵堪治同甘菊而目疾堪醫獨活入足少陰腎經上治頭項之難舒下治腰膝之不遂散寒驅風與羌活同羌活氣雄遊風多功獨活氣細伏風多益白芷入大腸肺胃司手太陰引經止足陽明頭痛去皮膚風邪驅頭面遊風合菊花而目淚止和細辛而鼻塞通在瘍家有止痛排膿之效在女科有催生療帶之功多汗勿施津枯須避艾葉入肝漏血安胎而止痛闢寒暖宮而有子殺鬼氣固元陽赤白帶痢盡好灸百病治腹痛痔蟲瘡癬兼醫秦艽入肝膽寒濕風痹肢節疼痛而立解遍身黃疸骨蒸邪氣而併除下水利便不拘大小療風血痹無問久新腸風臟毒痔漏脫肛入陽明而利大腸去風寒而止疼痛得羌活能治上焦之邪氣萆薢善調中焦之軟弱加防己盡掃足膝之濕痹用酒洗功捷利濕而驅風刺蒺藜破癥結積聚喉痹與惡血治身體風癢頭痛與乳癰沙苑蒺藜入腎長肌肉明目輕身治腰痛固髓澀精荊芥入肝散浮風而頭痛頭眩可止清血熱而目疼目腫堪除同元參大力同收斑疹之功和生地桃仁共奏血風之續腸風崩漏炒黑多神白濁莖痛單煎尤妙防風入脾肺風劑之總使風病之主司泄肺金除喘哮咳嗽疏關節祛癱瘓攣痹收汗作黃耆之捍衛發汗為羌活之追隨鼻鼽鼻塞例從夷細目疼目淚法並菊荊菊花入肝肺腎治傷風頭眩腫毒與目淚療四肢遊風腰痛與中煩安腸胃養血明目而去翳活死肌惡風濕痹而蠲除野菊辛溫稍有小毒治癰腫瘰癧疔毒眼瘜破婦人宿血止泄調中薄荷入肝肺掃腫痛於咽喉消風熱於頭面大人虛熱無能赤子風痰可利目紅斑疹投機汗渴津衰緣薄桑葉祛風發汗喘嗽可痊逐水寬胸煩痰並治養肝以明目調血而髮長枝有養筋消食之功耳堪調經止帶之用蟬衣入肺掃瘡癩皮膚瘙癢止目睛風熱翳淚得風木之象類含楊柳之陰精蛇蛻去翳膜明目而療白癜定驚癇催生而卻惡瘡祛風殺蟲除蠱瘧痔漏疥癬亦能醫皂角刺入肺肝直達瘡所有潰膿消腫之功透入七門有通關利竅之力穿山甲入肝胃潰膿破血殺鬼止驚發痘漿之不足定瘧疾而有靈藁本入肝治風寒頭痛在腦療寒邪結郁在胸婦人疝瘕陰腫而能消腹中急痛濕痹而悉退長肌肉順皮色威靈仙入肝肺專理痰風寒濕因疏痠疼麻痹橫行臂指憑薄桂以交馳下行足膝藉瓜防而相贊性頗不純和虛者毋多犯殭蠶入肺治中風失音去皮膚風癢化風痰消瘰癧拔疔毒減斑痕男子陰癢女人崩淋虎骨入肝腎壯筋骨而痿軟可起搜毒風而攣痛堪靈虎肚反胃有功虎爪辟邪殺鬼虎發能止齒痛虎屎塗消惡瘡蜈蚣去惡血墮婦人未産之胎搜風邪療小兒急搐之病天麻入肝治痰厥而耳鳴目暈療風癇而魄悸魂驚語言不遂之仙芝麻痹不仁之瑤草散熱升麻入陽明經治肺痿肺癰與瘡腫下陷黑紫療時氣熱病與寒風發散無汗喉咽腫痛藉為從治勞倦內傷藉此升提瀉痢因氣陷而虛徒補無益便溺因氣陷而閉專降奚通引蔥白手陽明之風邪可散引石膏足陽明之齒痛能攻氣虛下陷是因宜氣實上壅非所利柴胡入肝膽散膽邪解往來肌表之寒熱瀉肝火除左右胸脅之膨疼合丹皮秦艽而投於四物調月水之愆期和升麻黃耆而雜於四君舉清陽之陷下暫宜於無汗之骨蒸專利乎多熱之痎瘧前胡入肺脾順氣消痰止嗽安胎驅肺風定哮除喘理肺氣疏膈清胸熱鬱咽喉元薄為之侶寒包聲啞防細為之隨香薷入脾肺漱齒則鬱火散而穢氣息調脾則濕邪去而清化行祛暑毒甚捷消水腫極靈痎瘧上池飲帶下橘井泉實人可矣虛其審諸藿香入脾胃和風溫中開胃進食止霍亂疼嘔之交作療山嵐寒熱之並行連翹入心及心胞絡瀉心經客熱降脾胃濕熱通淋通經堪任解毒消癰須求乾葛止渴解酲散寒消熱利二便而止嘔消痹解肌毒與中風頭痛傷寒諸熱俱消發表取汗立應治脾虛而瀉胃火除熱毒而療金瘡大抵辛溫可以散表甘寒可以瀉火乾葛則其甘寒者也紫蘇則其辛溫者也傷寒在太陽必麻黃可以取汗風寒在腠理無紫蘇不能攻表至若風溫之症風邪未解其汗自出不可投以再汗之藥溫熱之疫自汗大來表邪尤甚不可投以辛溫之劑二症欲解必須乾葛使其甘寒消肌退熱其花專解酒毒過服損人天元香散白豆仁氣塞胸襟如颶風之揚石翳蒙瞳子似皓月之離云嘔噦添乎薑藿痰飲加之二陳草豆蔻入脾胃溫中治腹心冷痛和氣去脾胃虛寒風寒客邪而必用霍亂吐瀉以成功調氣散冷甚速酒毒口臭兼攻肉豆蔻溫中開胃下氣消食治積冷心腹脹滿定霍亂脾胃虛寒冷熱虛泄能止赤白痢下能痊小兒傷乳之吐瀉用之最宜大人五更之腎泄非此莫治然虛瀉必佐以參苓脾泄當助以參術火泄舍黃連不可濕瀉除蒼朮何堪寒泄當合以薑桂飧泄合助以防風木香入肺肝損九種心痛療七般疝痛五積曰效六聚云靈後重仗檳榔以夾攻帶下賴黃連以相濟燥熱有妨妊娠無忌白芥子入肺皮裡膜外之痰涎非斯不達肋下胸前之氣滯藉此而疏喘哮與蘇子相須咳嗽與桔梗並濟枳殼入肺除濕氣凝於筋骨而屈伸不利理風氣著於皮毛而痛癢難禁瀉肝則膈脹可平喘哮咳嗽尤利寬腸則後重可止痔痢腸風更良束肥胎而易産甘草兼施磨睛障之難消決明兼制脫陰者神矣氣虛者禁之香附入肝膽氣候之總司女科之主帥開鬱而結痰消溫胃而宿食化治血凝醋炒為良解胸熱便浸為善生用有耗血之虞炒用有止血之驗丁香入肺胃攻胃口之寒痰而嘔吐除祛心下之冷痛而厄逆寧噎膈翻胃賴為劫劑奔豚疝氣藉茲引經沉香入脾胃肝腎降逆氣而決痰涎功猶破竹祛惡氣而行積聚力抵剚犀借曰溫中未嘗助火雖云決氣亦不傷真大腸氣閉可通小便氣淋可利半夏入肺腎舒肢節療痠疼與僵直開胸膈止嘔吐與昏迷共天麻而頭旋即痊同秫米而不瞑克寧既治遺精復除帶下脾胃濕盛有痰惟伊之投心腎血虛有火獨彼之愆大茴香入肝腎開胃口寒痰之噎膈散膀胱疝氣之衝心益智仁入肺心腎溫脾胃而加餐暖膀胱以節溺腹中疝沖調氣功最腸鳴腎瀉扶虛堪嘗能祛胃脘之涎偏補命門之火良薑入胃利脾胃消宿食兼理心氣冷之攻衝消霍亂止腹痛並治胃虛寒之嘔逆乾薑療胸滿咳逆之氣逐風濕腸澼之寒生辛能散肺經之寒嗽而發汗炮苦能溫脾臟之陰寒而止血泄利霍亂腹滿三焦冷痛而收功痼寒腎冷無陽附子同煎而療理反胃嘔逆均可服癥瘕積滯悉皆除水瀉無度須炙末口瘡腫爛共黃連石菖蒲入心脾肺辛香邪可闢燥烈郁堪行鼻塞耳鳴夾黃連以開心竅健忘驚悸偕遠志以肅心神入平胃散而云單鼓脹消惟宜暴病入參苓散而云噤口痢奪獨利脾虧既害津枯又妨赤目吳茱萸入肝脾下胸脅冷氣之滯藉以推用攻膀胱寒疝之痛求之少佐腹痛腸鳴屬寒則可吞酸嘔吐是火非宜熱痢賴黃連而奏效寒痰卻半夏而無功龍腦香消風化濕而開關通竅驅逐鬼邪而目明耳聰風熱痰涎壅盛昏滋目痹潛消乳蛾喉閉須此舌腫破爛功高世知其寒而通利未達其暖而輕浮然人陽易動陰易虧誰知此藥辛溫善走故能散熱利氣時人目痛喉痹下疳必用者以火濟火如燒酒洗眼獲效辛散故也陳皮安胃去痰導壅滯之逆氣利水通淋消胃中之穀氣能散風寒暑濕之邪氣善舒七情六欲之結氣健腸胃而利臟腑定嘔吐而清氣癖止泄瀉定霍亂與白朮而同功寬胸膈除嘔逆和薑連而佐理留白補胃和中去白消痰泄氣健脾之功最捷辛溫不守之質須知辛主發散而不斂妄液自汗之症不可服溫能引血以妄行元虛吐血之患不可嘗去邪辟惡脾胃攻補橘皮入肺留白補胃和中去白消痰瀉氣降痰涎以寧喘嗽清痰積以豁胸襟朴蒼得此共成補胃之功參術兼茲共奏補脾之績伍藿薑而嘔吐可痊助香蘇而冒風亦驗橘葉導胸脅之逆氣行肝經之恚怒乳癰脅癰能消藥中行經至寶橘核沉降苦溫而入厥陰腰痛腎冷疝氣能擒實者為宜虛人所禁青皮入肝肺破滯氣消堅癥解胸脅之膨柴胡是佐疏心腹之痛香砂是襄同草果有驅瘧之能共紫蘇有發汗之效木瓜入肝脾肺利肝氣除霍亂之轉筋平胃氣療傷暑之吐瀉風濕腫痛勿逡巡腳氣攣痹深投契利濕蒼朮入脾胃平胃氣而嘔吐息寒涎宿食皆清掃脾濕而瀉痢除帶下腸風咸驗佐黃柏而腰膝之痿痹旋利和羌半而關節之重痛隨瘳嵐毒與時災功惟發汗眩昏及痎瘧效在消痰辟邪者取氣之芬芳開鬱者藉性之燥烈津耗毋施汗多須缺厚朴入脾清積聚止嘔吐而平胃調中祛暑穢豁痰涎而開胃進食瘧痢不可無嵐嶂奚堪缺枳實入肝和半夏消胃腑之痰共黃連泄心下之痞大黃得此通熱結以何難稜茂逢茲削堅癥而甚易停水須加澤瀉瘀紅賴佐桃仁侶藿薑而寬中定嘔多驗同參術而補脾磨谷如神草果入脾散寒止心腹之痛下氣驅逆滿之疴開胃而利霍亂吐瀉攻堅而破噎膈癥瘕瘧邪須用燥濕必投白扁豆入脾肺清濕熱以祛暑毒兼資蒼朴香薷強脾胃以益中州全賴參苓白朮瘧固宜之痢亦宜然茵陳入膀胱愈風濕而發汗能利水以化痰專走氣分而利濕熱祛除黃疸而勝金丹地膚子去皮膚之熱療疝瘕惡瘡治妊娠淋瀝浴丈夫陰㿗祛寒附子通十二經稟雄悍之質司斬關之能引補氣藥失散之元陽可挽引補血藥虛極之真陰可扶同發散藥在表之寒濕易除而痿厥攣痹陡愈同溫經藥在裡之寒濕可逐而腹痛滑瀉隨寧治陽虛厥逆真寒理陰盛格陽假熱用而宜霎時起死投之誤頃刻損生天雄入腎稟純陽之性補三焦命門壯陽精強腎氣過於附子祛濕痹除拘攣專於墮胎風寒歷節而關竅不利元陽素虛而厥冷脈沉烏頭除寒濕痹與咳逆上氣破癥積聚與胸膈寒痰治四肢風痛而不能屈伸療肩背痠痛而不能俯仰烏藥入脾肺胃膀胱主膀胱冷氣攻衝療胸腹積停為痛天行疫瘴宜投鬼犯蠱傷莫廢痰食稽留而霍亂吐瀉氣血凝滯而七情鬱結肉桂入肝腎補腎臟之元陽而厥寒陡息溫胃家之虛冷而泄瀉遂寧結氣逆氣能除心痛肋痛可療泛上之浮陽藉斯從治鬱滯之水府仗以宣通桂心理心腹之恙三蟲九痛皆瘥補氣脈之虛五勞七傷多驗宣氣血而無壅利關節而有靈托癰疽痘毒能引血成膿牡桂補中益氣而利關節通脈止煩而去邪汗結氣逆氣而能消心痛肋痛而立止溫胃調經消瘀散氣筒桂主百病而養精神逐寒邪而悅顏色薄而能宣為諸藥之通使溫而不熱行三焦之結滯平降石決明入肺肝治青盲而消赤眼白膜收目淚而除風熱頭疼掃肝熱而益精光貼腦心而止鼻紅旋覆花入肺補中下氣明目而除頭風祛熱消痰氣結而除胸滿風痰噫氣而能除續筋補損而有效款冬花入肺潤心肺消痰止嗽而定喘治咳逆吐膿肺癰與肺痿心虛驚悸涕唾稠黏洗肝明日療驚癇與喉閉寒熱邪氣除虛煩與消渴馬兜鈴入肺醫肺熱咳嗽氣逆連續而可止療痰結喘促血痔瘻瘡而熏醫大腹皮入肺脾健脾開胃而諸氣快利水通淋而縮胎氣痞滿膨脹壅滯膈痰而能豁水氣浮腫腳氣壅逆而堪療木賊入肝退翳膜而止淚散肝肺之風邪實瘧須用發汗亦宜山楂入脾肺寬胃加餐必用性消內積舒筋療疝堪求味走肝經小兒有化乳消疳之妙痘疹偏宜産婦有通經治水之能兒枕尤要麥芽入胃健脾胃而消化宿食破癥結醫冷氣心疼腹脅脹滿開胃而止霍亂下氣消痰催生而行滯血産後閉結能通胃氣膨脹悉退萊蔔子入肺利氣清痰以治肺家之喘逆溫中消食以疏胃氣之壅凝侶菖蒲而鼓脹堪平混陳皮而面積可滌神麯入肺胃寬胃加餐飲食不思者真驗醒脾磨谷胸腹不快者殊靈黃連薑藿渾施霍亂之疴澤瀉蒼苓偕奏瀉痢之績杏仁入肺上能潤肺下能潤腸喘嗽因風傷而堪散蘇子兼行便難屬氣閉而堪通橘紅並使調勻輕粉能點時瘡之毒搗爛如泥可殺玉戶之蟲三瀉劑瀉火犀角入心胃解心熱傷寒發狂清心神中風不語止吐血而治驚癇疏痘毒而化斑疹羚羊角入肺肝心清肺熱治腸風臟毒瀉肝火療目痛昏花且理傷寒寒熱之不除抑調産血血風之雜症黃芩入肺心脾中枯而飄者入肺止喘咳滑痰火解肌熱於風寒疫瘧中實而堅者入腸調月經安胎妊去血熱於痔痢腸風單制單煎詳失血之虛實三黃三補推積熱之淺深雖合有餘之燥熱無如不足之癆症黃連入心肝實熱客於心肝而目疼目腫濕熱釀於腸胃而便紅便白痞滿宜偕枳實煩渴須和門冬佐吳萸以除脅痛合烏梅以伏蛇蟲痔癖瘡疽狂熱傷寒均效胎丹積火小兒疳痢同功祛膈熱兮兼厚腸酒焙為善清痰火兮並平胃薑製尤工胡黃連入心脾清肝膽明兩目同烏梅而止血痢主瘡痍療五痔偕乾薑而消果積溫瘧骨蒸煩勞兒家驚癇寒熱婦人胎蒸必用小兒疳積難離龍膽草主肝膽邪熱清下焦濕火癰腫黃疸兩眸赤腫殺腸中之小蟲掃小兒之驚疳知母入腎肺抑腎火有餘使血脈之熱平而嗽寧喘定滋肺金不足使腸胃之枯潤而渴止便通溫瘧勿克無傷寒豈容缺淋閉堪嗽煩渴尤捷雖宜有汗勞蒸久服須防脾泄玄參入腎抑無根虛火滋不足真陰助苓冬除太陰火燥之咳嗽和升葛解陽明風濕之斑疹吐衄與癆蒸而瘰癧尤善傷寒與瘟疫而積食殊靈咽喉腫痛同甘梗以相使眸子赤熱尋荊菊以交行苦參入腎肝消心腹結氣與癥瘕積聚能明目止淚與黃疸逐水時氣惡病與熱痢心熱煩躁與癰疽遍身肌膚疼癢胸腹陰處頑痹大風大熱有功溺中遺瀝堪止厲風屑發盡落丸服可以取效皮燥抓癢風屑酒製可以除根沙參入肝肺益心氣以安驚養肝氣以除疝肺痿肺癰而痰濃最當癆蒸癆嗽而血溢須遵培陰助乎生地補虛效佐人參人參補五臟之陽而生陰肺寒稱聖沙參補五臟之陰以制火肺熱推尊丹皮入心肝清臟腑瘀紅以調不期之月水驅陰中伏火而除無汗之骨蒸生新血賴和歸地去舊血須夾桃紅大宜吐衄最忌崩中胎前慮其傷血産後仗以通經地骨皮入肺肝腎外祛風濕內解邪熱治骨中有汗除氣中有火合雄黃為末吹喉嚨之腫痛共秦艽釀酒起筋骨之攣痹桑白皮入肺瀉肺氣之有餘而止咳嗽益元氣之不足而補中虛消水腫勞熱亦治止唾血肺熱亦宜山梔降肺經鬱結之火以輸膀胱去皮膚濕熱之黃以清腸胃五淋通療五膽群消嘈雜嘔噦薑製侶乎竹茹吐衄崩漏炒黑偕之柏葉虛煩懊憹之不眠香豉斯弼熱厥心疼之無息薑連是匡石斛入胃腎強陽益陰而壯筋骨定志除驚而補五臟治絶傷療軟虛勞羸瘦兼醫平胃氣生肌皮膚邪熱盡除腳膝痹弱須此腸胃泄瀉堪醫石膏入肺胃性秉陰寒質偏重墜佐芎藭則除頭痛引升麻則治牙疼合麥冬而消渴解同人參而暑毒清陽明實熱之傷寒必藉苓連與知母太陰熱痰之發喘須同甘桔與麻黃黃柏入太陽經降腎家實火以滋陰眩暈癆症俱效去膀胱濕熱而潤燥瘡疽痿躄皆靈白帶協蓮房牡蠣黃疸夾梔子茵陳神哉吐衄妙矣癃淋枇杷葉入肺胃和暑嘔大消燥渴清肺熱立定喘嗽反胃與蘆根同用痰火與麥冬並施天竹黃入心肺療風熱失音痰壅養五臟鎮心明目小兒涼風與天弔客忤丈夫清熱與止渴消癥淡竹葉專通小便兼解心煩根能墮胎孕婦忌服大力子入肺清痘毒而胎中淫火可降利咽喉而膈上風痰可除蘆根入肺胃膀胱腎下噎膈之痰清吐逆之火三陽祕結之靈丹三消渴病之神品防己入膀胱祛下焦之濕瀉血分之熱理水腫腳氣通二便閉結木專治風漢能利水忍冬花起筋骨之痿疲而身輕步健祛肢體之風濕而腫散痛止尸注大有靈鬼擊良多捷血痢罔分虛實瘡疽安問淺深白薇入胃療中風身熱支滿祛邪氣寒熱痠疼傷中淋露溫瘧狂惑下水氣總取益陰之功治遺尿不拘胎前産後青黛入肝瀉肝火解鬱結吐紅疳痢與驚癇除風熱清發斑殺蟲解毒與口疳瀉實硝石入肺心逐六腑積聚鬱而不解滌腸胃飲食滯而不消傷寒煩滿可以成功寒熱邪氣必能驅逐芒硝通經脈而利二便行月水而治五淋破腹中痰實留血結搏而不解祛五臟結聚煩熱氣閉而能開辛能潤燥咸能軟堅煅煉數次即是玄明玄明粉入胃大腸涼心膈而煩躁除清腸胃而宿垢蕩眸精紅可卻惟宜實熱胃脘痛能止勿利虛寒結痰之用咸能軟堅也結熱之加咸能潤燥也巴豆入心蕩滌五臟六腑之堅積開通水穀道路之壅塞傷寒溫瘧寒熱癥瘕而能消結聚留飲痰癖水腫而能退通月水殺臟腑諸蟲去惡肉排癰疽膿腫乃斬關奪門之將有戡亂劫病之功胎兒立墮疔毒施抽大黃入脾大腸祛積熱頑痰下結便瘀血傳裡傷寒效若鼓桴之應初成帶下功同形影之隨目紅腦烈火熱方良頭痛牙疼風寒須避吐衄雖靈必審氣強氣弱癰疽固善還揆毒淺毒深下走生施上行酒製蘆薈入肺胃去膈間熱氣而明目鎮心治小兒諸熱而驚顛風癇療五疳殺三蟲風熱食積並去醫痔疾卻瘻瘡巴豆有毒能消瀉水萆薢入肝脾胃祛風濕以除腰膝痠疼筋舒步健滲濕熱以清膀胱渾濁帶止淋寧澤瀉入膀胱小腸腎驅心下伏水以消急滿決脬中留垢以愈淋癃佐黃柏而濕熱可清同蒼朮而瀉痢能除痰飲須夾半夏腫脹兼和腹皮以其嚮導於腎經故克先容於熟地車前子入肺肝膀胱利小便而淋癃效清濕熱而腫瀉除雖同滲泄之儔不走真元之氣木通入心肺小腸膀胱泄小腸之熱可心火自清通諸經之竅而瘀血自行淋癃實者真驗瀉腫暴者殊靈瘍家以排膿解毒女科以下乳通經瞿麥入小腸膀胱關格癃閉而能通小便熱淋而能止下閉血出木刺能逐膀胱之邪排癰腫去目翳可墮婦人之子燈心入心肺清心必用利水偏宜燒灰吹喉痹塗乳治夜啼滑石入肺膀胱去膀胱留垢熱閉之淋癃可除清胃腑溽蒸暑傷之吐利能療漫言治渴實火方良雖曰行瘀虛寒須避石韋入肺膀胱下氣治煩補五勞而安五臟辟惡益精開癃閉而治五淋炒末飲酒可療發背本經治勞熱邪氣指勞力傷津癃閉不通之熱邪而言秋葵子通小便之淋下胎衣不下花消癰腫油浸塗湯火之傷潤下栝蔞實入肺清膈上凝結之頑痰唾咯難出潤喉間火燥之枯液咳嗽無聲陷心胸之邪熱解乳癖之毒熱上虞食減畏寒嘔吐須忌下防腸滑作瀉開結偏靈胡麻養血潤腸燥結焦煩誠易退補中益氣風淫癱瘓豈難除堅筋骨明耳目輕身不老長肌肉填腦髓辟穀延年生麻乳母常食小兒永免瘡瘍麻油熱者利大腸下胞衣生者摩瘡腫生禿髮降痰貝母入心肺開肺中之郁痰輔乎蘇橘解肺中之結熱相以元冬瘡瘍家取之排毒咽喉症尚之消壅宣肺痿之聲音清肺癰之膿血南星入肝治口眼喎斜與肢體麻痹不遂療牙關緊急與心神昏迷難清小兒驚搐如神女子妊娠須忌固宜於目暈頭眩尤妙於耳鳴心悸燥濕消痰功逾半夏半夏味辛而守南星性烈而走故須牛膽一制庶幾燥烈全收膽星取牛膽之苦寒制南星之辛燥膽有益肝鎮驚之功星有消風利痰之力驚風驚痰可治虛火虛痰可療要知南星治痰能治有餘膽星治痰可治不足如元實氣盛之人遇風痰氣盛之症非南星不散如元虛氣弱之人遇驚虛痰嗽之症非膽星莫除二星分用不可不辨豬苓入脾肺添半夏而痰飲消佐腹皮而水腫退收泄瀉之功君宜白朮奏淋癃之捷佐賴車前一曰汗多口渴者宜以其小便數而濕熱之交勝一曰汗多口渴者禁以其小便長而津液之偏枯久服喪明多需戕腎佛耳子入肺下痰作喘能祛肺脹止哮發嗽大救金瘡竹茹入肺胃胸中痰熱而生嘔噦管鮑之投病後虛煩而發懊憹期牙之遇厄逆是火深懷望脾胃果寒勿克當竹瀝入肺消經絡之痰以療淋痹脾虛不食者何害濡腸胃之燥以消煩渴三陽閉結者尤當耳鳴目暈金漿天吊驚癇玉隨中風而牙關緊閉遊刃有餘傷寒而狂熱兼痰拾芥之易皂莢味辛而散氣烈而鋒涎氣逆於胸膈而牙噤無知痰氣凝於經絡而肢牽罔遂師吐法則相雜乎礬石處湯劑則連結乎南星氣實猝倒醒魂丹氣虛猝倒歸毒海石入肺結痰同礬石而能消濕痰同半夏而能燥降熱痰須和玄明粉去頑痰當合栝蔞仁入丸則可入煎無益天花粉入肝肺解瘡疽之毒而膿腫消去心胸之熱而咳嗽絶痰火藉以清燥渴賴伊解傷寒通用瘟疫宜行四血劑溫血乳香入心通十二經調血氣而定諸經之痛療諸瘡而除心腹之疼活血舒筋催生治痢當歸入心肝脾血藥之主帥血病之總司調百疾於胎前療諸疴於産後助黃耆名補血湯虛熱多神互芎藭稱佛手散催生專善諸痢藉之養血諸瘡伏以和營腰脊痛而血弱者可用脾胃虛而濕盛者難從川芎入肝上行頭角助清陽而止痛下行血海疏肝氣以調經去諸風兼能燥濕和胎妊抑善催生合桃紅而去舊佐歸地以生新理鬱氣除腹痛故血中有氣藥之稱散寒邪發汗液故久服有暴亡之禍大小薊入肝脾大薊主癰腫而吐衄除赤白之帶下小薊專於破血不能消腫澤蘭入肝脾推陳血而不峻生新血而不凝産後蓐癆為養榮之至寶胎前怯弱乃調經之佳珍涼血生地黃入心腎涼心火而除上溢下泄之血滋腎水以療三焦五心之熱卻胎前滲漏調産後崩淋經愆漸變癆症多食始善榮耗幾成燥症久餌為良生血涼血通宜痰凝氣凝獨忌紅花入肝腰腹因血滯而疼非伊莫治頭目為血湧而暈舍此何求欲養血勿多加欲行血勿少用赤芍入肝肺去眸眥之赤熱清臟腑之瘀紅在瘍家有解毒之需在女科有墮胎之説地榆入肝心肺胃療崩帶與月水不止清下焦而痢血腸紅燒灰油調可治火燙虛寒水瀉冷痢禁用槐花入肝膽止便紅除血痢咸藉清腸之力療五痔明眼目皆資滌熱之功子名槐角用頗相同兼行血而降氣亦催生而墮胎枝主陰囊濕癢葉醫疥癬疔疽側柏葉止吐衄來紅定崩淋下血歷節風疼可愈周身濕痹能安柏子仁安神定悸壯水強陽潤血而容顏美少補虛而耳目聰明茅根入肝心治勞傷補中益氣除瘀血利便通淋止消渴治傷寒厄逆喘噦除吐衄療黃疸水腫胃反紫菀入肺治肺痿聲嘶而膿中夾血醫癆症火嗽而痰里兼紅赤子驚癇曾有益老人便結頗多功剪草色赤而甘性涼而澀血之溢乎上竅者不啻金丹之捷血之泄乎下竅者無過常藥之能女貞子實入肝腎清肺火腸紅有驗補肝血黑髮多功伴地黃首烏能補腎虛固益智金櫻滑精堪醫下血紫參通九竅利二便心腹積聚能消行血閉止血衄寒熱邪氣可療鬱金入心肺破惡積之血除尿淋之紅宿血心痛加薑汁而有效痰中帶血入竹瀝而有良三稜逐年壯之積聚破氣實之癥瘕瘡科用此而潰堅消腫女科藉此而破血通經蓬朮削堅積而通瘀血捷似風行宣滯氣而蠲腹痛幾同雷迅血實經閉者近之氣弱重身者遠之黃薑祛邪辟惡風痹臂痛産後敗血攻心癰疽撲損消瘀蒲黃入肝生則破血消腫炒黑補血止紅協五靈療兒枕塊痛同乾薑摻舌脹滿口丹參入心肝安神散結益氣養陰破宿生新癥瘕積聚能除安胎墮死血崩帶下可止益母草入肝行血不傷補血不滯蠲血痛於腰腹不拘虛實調愆期之經脈無問後先未産投之而不致難生既産用之而無虞他病劉寄奴治心腹之刺痛而下氣固速破經絡之瘀血而止痢尤神蘇木入脾肺腎宣表裡之風邪除新舊之瘀血沒藥療産後惡露不通治跌撲血滯腫痛去瘀生肌破血止疼可攻目翳堪墮胎兒血竭瘀血伏其洋化金瘡重其布仁名號麒麟美色宗於番降逼真桃仁入肝治血因氣滯而心腹堅疼理血被風凝而皮膚燥癢大腸血涸而難便固宜用唇皮火燥而欲裂尤堪施郁李仁入肺脾大腸利小便之水而止周身之痛潤大腸之燥而通氣血之結五靈脂入肝止血氣之痛行冷滯之瘀熟用止血生用破瘀元胡索行血中氣滯破氣中血凝調經候不利於胎前清血瘀卻宜於産後諸疝可痊諸痛可投五雜劑收斂五味子入肺保肺家耗散之金而嗽久者尤善補腎經枯涸之水而精滑者為優療神氣不足之昏眸解津液不足之煩渴共黃耆酸棗能收虛汗之功同肉果吳萸可奏子泄之效五倍子斂肺化痰故止嗽有要散熱生津故止渴相宜上下之血皆止陰陽之汗咸瘳瀉痢久而能斷腫毒發而能消糝口瘡須臾可食洗脫肛頃刻能收染鬚髮之白治目爛之疴烏梅入肺大腸收肺氣除煩止渴治瀉痢調胃和中治嘔吐蛔蟲療下血腸紅牡蠣入肝腎擅遺精之妙用得斂汗之靈通旋施漏下漫治崩中墜凝痰與脅肋消瘰癧與喉嚨龍骨入心腎大腸固氣澀腸脫肛之用安神定魄多夢之施泄痢遺精稱聖盜汗崩漏通神驚癇狂顛安神定魄齒敢當之完膚補漏斂汗止血骨將用也蛇床子入腎脾服同補劑興陽慓悍何當末搽疥癩燥濕干膿一捷伏龍肝入肝治崩中帶下療尿血遺精中惡反胃濕毒諸瘡棗仁入心生心血以收虛汗須同生地黃耆益中氣以御虛煩賴佐人參竹葉定紛紜於夢寐安神魄於怔忡膽實多眠屬熱生用為良膽虛不睡為寒炒則為善山茱萸入肝強腰足起痿躄之痠疼培腎肝塞精髓之遺泄療女子月信違期治老人便多失節目暗耳鳴雜壯火之類陽衰陰痿入養火之門白芍入肝脾清腸澼之便紅療血虛之腹痛盜汗則賴黃耆失血則和生地佐當歸而成補血之功臣白朮而以致扶脾之益新産與高年者勿用秋冬及虛甚者毋投白礬消痰止痢滌熱祛風收脫肛陰挺理疥癬濕淫緑礬化痰消積燥脾濕黃疸腫脹兼破瘀殺蟲使君子入胃殺諸蟲而不傷胃療瀉痢而忌熱茶百部入肺治肺熱咳嗽可止消氣逆骨蒸盡除疳蛔寸白與傳尸暴咳久嗽而立止檳榔入肺脾走後重殺三蟲破滯氣而逐水消宿食以墜痰除嵐瘴痎瘧之戰栗杜疝瘕腳氣之攻衝積聚氣實則優食減脾虛則咎吐劑常山入肺截溫瘧之不已夾攻須草果檳榔慮元氣之受傷相劑必人參白朮此痰涎之劫藥匪寒熱之神根附反畏歌十八反歌本草明言十八反半蔞貝蘞及攻烏烏頭反半夏瓜蔞貝母白蘞白及藻戟遂芫俱反草甘草反海藻大戟甘遂芫花諸參辛芍叛藜蘆藜蘆反人參沙參苦參丹參細辛芍藥十九畏歌硫黃原是火之精朴硝一遇便相爭水銀不與砒霜共狼毒怕見密陀僧巴豆性烈最為猛偏與牽牛不順情丁香弗使鬱金見牙硝難合荊三稜川烏草烏不共犀犀角人參最怕五靈脂官桂善能調冷氣若逢石脂便相斯
