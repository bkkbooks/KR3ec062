front:
  text: 序喻子云醫之為言意也明夫天地陰陽之道盈虛消長之機始可與言醫醫道豈易言哉古之聖人視醫甚重良以軒岐旨奧扁倉淵微以意逞志斯能得之範子不云乎不為良相必作良醫君子用之以衛己衛民而推之以濟人濟世其術何其仁其品何其高抑學之豈非重且難歟余稟資稚魯幼失提撕弱冠受業于徐夫子授讀內難諸經苦茫無涯涘及下帷數載略識蹊徑奚敢謬稱知醫側聞師言讀書先求識字學醫須先時藥性李氏綱目美矣備矣初學每苦其繁欲得捷徑苦無善本偶於滬上舊書鋪購得高鼓峰先生藥論隨筆一編覺其句簡而用備的是初學之津梁惜乎藥味太少不足應用歲辛丑又於親家淡園吳公處得藥能一書閲之亦甚簡明取以熔化一爐互較所弊誠為渡海之慈航醫家之鴻寶也惟書系抄本舛謬滋多而品種亦有蕪雜之處遂稍加校勘編輯一過使初學一目瞭然其於入門之始不無小補云爾時在光緒二十七年二月杏苑沈文彬識於鑄青草廬
  hash: sha256:6da6212a2200dc364aea10f18fac962fd8530a8d74bcc836462e2bcaf02e62c2
